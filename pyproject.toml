[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "wheel"]

[project]
authors = [{name = "oslumen community", email = "contact@oslumen.org"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics"
]
description = "DOLFINx (FEniCSx) with complex-scalar PETSc and SLEPc, packaged as a binary wheel"
dynamic = ["version"]
keywords = ["dolfinx", "fenics", "fenicsx", "finite element", "petsc", "slepc"]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE*"]
maintainers = [{name = "Benjamin Vial", email = "benjamin.vial84@gmail.com"}]
name = "dolfinx-solver-complex"
readme = "README.md"
requires-python = ">=3.12"

# The fenics-basix/ffcx/ufl pins are copied verbatim from upstream DOLFINx's
# python/pyproject.toml at the mirrored release (v0.11.0.post0): upstream's own
# pins are the coupling contract between the C++ core in this wheel and the
# pure-python trio, and CI's pin_check asserts they still agree.
#
# mpich is bounded to one major series rather than floored: the soname stays
# libmpi.so.12 across series, but the libmpifort this wheel vendors is built
# against a particular libmpi's exported symbols, and an older runtime would
# fail at the user's first import. The bound tracks the series the vendored
# build comes from. mpi4py is unpinned and is what loads that libmpi first.
# Spec §5, §10; ADR-0001.
dependencies = [
  "cffi",
  "fenics-basix>=0.11.0,<0.12.0",
  "fenics-ffcx>=0.11.0,<0.12.0",
  "fenics-ufl>=2026.1.0,<2026.2.0",
  "mpi4py",
  "mpich>=5.0,<6",
  "numpy>=2"
]

[project.optional-dependencies]
dev = ["abi3audit", "auditwheel>=6.0", "build", "mypy", "packaging", "pytest>=7.0", "pyyaml", "ruff", "wheel"]

[project.urls]
"Bug Tracker" = "https://github.com/benvial/dolfinx-solver/issues"
Homepage = "https://github.com/benvial/dolfinx-solver"
Repository = "https://github.com/benvial/dolfinx-solver"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
python_version = "3.12"
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The payload the wheeltest stages import — dolfinx, petsc4py, slepc4py and
# the libraries they lean on — exists only inside a built wheel, installed
# into a venv the suite makes and throws away. The machine that type-checks
# this repository never has it, so these imports are unresolvable here by
# construction rather than by omission; the stages themselves are what check
# that they resolve where it matters.
ignore_missing_imports = true
module = [
  "dolfinx",
  "dolfinx.*",
  "mpi4py",
  "mpi4py.*",
  "slepc4py",
  "ufl"
]

[tool.pytest.ini_options]
# The build drivers are imported from the source tree and installed into no
# wheel, so a bare `pytest` has to find them the way `python -m pytest` does.
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "ANN",  # flake8-annotations (docstrings carry the argument docs)
  "COM812",  # missing-trailing-comma (formatter owns this)
  "CPY001",  # missing copyright notice
  "D203",
  "D213",
  "EM101",
  "EM102",
  "PLR0913",  # too-many-arguments (keyword-only build entry points)
  "PERF401",
  "PLR2004",
  "S603",  # subprocess call (build tooling drives cmake/auditwheel)
  "S607",
  "TC003",  # typing-only-standard-library-import
  "TRY003"
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "INP001", "S101", "PLC0415", "PT011"]
"wheelbuild/*.py" = ["T201"]  # build steps report progress on stdout
# T201: the stages report their findings on stdout, as the build steps do.
# PLC0415: the payload is imported inside the functions that use it, never
# at module scope — the module path has to be corrected first (see
# wheeltest.payload), and the stages have to stay importable by the unit
# tests on a machine where no wheel is installed at all.
"wheeltest/*.py" = ["T201", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.dynamic]
version = {attr = "dolfinx_solver._version.__version__"}

[tool.setuptools.package-data]
# Vendored shared libraries and the harvested notices live inside this package
# and are put there by the build, not checked in.
dolfinx_solver = ["lib/*", "lib/**/*", "py.typed", "THIRD-PARTY-NOTICES"]

[tool.setuptools.packages.find]
# Only this package is built from the source tree. The rest of the payload —
# dolfinx, petsc4py and slepc4py under their upstream import names — is
# grafted into the wheel as top-level siblings by wheelbuild's assembly step
# (spec §6), which is also the layout the sibling-rpath linkage and the
# foreign-petsc4py check in dolfinx_solver._bootstrap expect.
include = ["dolfinx_solver", "dolfinx_solver.*"]
